[package]
name = "vajabaki-mobile"
version = "0.1.0"
description = "VajaBaki mobile shell"
edition = "2021"

[lib]
name = "vajabaki_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android's WebView has no download support (wry registers no DownloadListener), so files
# generated by the web app are written to public storage / shared through these instead.
[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"
tauri-plugin-android-fs = { version = "29", features = ["legacy_storage_permission"] }

[[bin]]
name = "vajabaki-mobile"
path = "src/main.rs"
