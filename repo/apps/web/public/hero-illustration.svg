    <rect x="320" y="222" width="64" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="72" y="244" width="160" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="320" y="244" width="64" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <line x1="72" y1="270" x2="384" y2="270" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="260" y="286" width="124" height="10" rx="5" fill="#0f172a" fill-opacity="0.8"/>
