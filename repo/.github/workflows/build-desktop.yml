name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop project deps
        working-directory: apps/desktop
        run: npm install

      - name: Generate app icons from source image
        working-directory: apps/desktop
        run: npx @tauri-apps/cli icon icon-source.png -o src-tauri/icons

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: kag-mall-desktop-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
